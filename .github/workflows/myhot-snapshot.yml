name: Publish MyHOT snapshot

on:
  push:
    paths:
      - .github/workflows/myhot-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public MyHOT snapshot
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "https://myhot-friends-reading.kimhim698.chatgpt.site/"
          target = Path("myhot")
          temp = Path("myhot-download")
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()

          def get(path):
              for attempt in range(4):
                  try:
                      request = Request(base + path, headers={"User-Agent": "MyHOT-snapshot-mirror/1.0"})
                      with urlopen(request, timeout=45) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{path}: HTTP {response.status}")
                          data = response.read()
                      if not data or data.lstrip().startswith(b"<!doctype html") and path.endswith(".json"):
                          raise RuntimeError(f"{path}: invalid JSON response")
                      return path, data
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)

          essentials = ["index.html", "styles.css", "app.js", "data/snapshot.json", "data/all.json", "data/research.json"]
          with ThreadPoolExecutor(max_workers=6) as pool:
              for path, data in pool.map(get, essentials):
                  output = temp / path
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(data)

          snapshot = json.loads((temp / "data/snapshot.json").read_text(encoding="utf-8"))
          research = json.loads((temp / "data/research.json").read_text(encoding="utf-8"))
          all_items = json.loads((temp / "data/all.json").read_text(encoding="utf-8"))
          def has_private_body(value):
              if isinstance(value, dict):
                  if any(key in value for key in ("bodyText", "bodyOriginal", "aiSummaryV3", "mtSummary")):
                      return True
                  return any(has_private_body(item) for item in value.values())
              if isinstance(value, list):
                  return any(has_private_body(item) for item in value)
              return False
          def has_private_excerpt(value):
              if isinstance(value, dict):
                  if value.get("access") == "source_account_required" and (value.get("excerpt") or value.get("summary")):
                      return True
                  return any(has_private_excerpt(item) for item in value.values())
              if isinstance(value, list):
                  return any(has_private_excerpt(item) for item in value)
              return False
          if any(has_private_body(value) for value in (snapshot, research, all_items)):
              raise RuntimeError("Full research text found in the public snapshot")
          if any(has_private_excerpt(value) for value in (snapshot, research, all_items)):
              raise RuntimeError("Private source excerpts found in the public snapshot")
          if len(research) != snapshot["researchTotal"]:
              raise RuntimeError("Research total changed during export")
          if (temp / "data/research").exists():
              raise RuntimeError("Private research details must not be mirrored")

          if target.exists():
              shutil.rmtree(target)
          temp.rename(target)
          print(f"Mirrored {snapshot['researchTotal']} research indexes without private details")
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A myhot
          if git diff --cached --quiet; then
            echo 'Snapshot already current'
          else
            git commit -m 'Publish MyHOT read-only snapshot'
            git push
          fi
